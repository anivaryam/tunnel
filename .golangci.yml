linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosimple
    - revive
    - gosec
    - nilnesserr
    - prealloc
    - unconvert
    - gocritic

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    - path: integration_test\.go
      linters:
        - errcheck
    - linters:
        - errcheck
      source: "defer|CloseNow|Close|Release|Serve\\(\\)|WriteToUDP|WriteEnvelope|w\\.Write|Encode"
    - linters:
        - staticcheck
      text: "SA1019"
    # gosec: Exclude hardcoded credentials false positives in test tokens
    - linters:
        - gosec
      text: "G101"
    # gosec: Exclude weak random number generators in test files
    - path: _test\.go
      linters:
        - gosec
