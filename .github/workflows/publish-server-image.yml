name: Publish server image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        required: true
        default: "v1.8.0"
      version:
        description: "Version to embed and tag"
        required: true
        default: "v1.8.0"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ inputs.version }}
          tags: |
            ghcr.io/anivaryam/tunnel-server:${{ inputs.version }}
            ghcr.io/anivaryam/tunnel-server:latest
